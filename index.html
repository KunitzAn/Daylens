<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Стартовые значения на кадр до JS; дальше lib/accents подменяет их на
         фактический фон под выбранный цвет приложения. Два тега с `media` —
         чтобы в тёмной системной теме не мигнуть светлой полосой. -->
    <meta name="theme-color" content="#f4f1f8" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#16151c" media="(prefers-color-scheme: dark)" />

    <!-- PWA / iOS «На экран Домой» -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Daylens" />

    <!-- Сплэш-скрины при холодном запуске PWA на iOS (иначе — белый экран
         несколько секунд, пока не смонтируется Vue). Марка на них — тот же
         apple-touch-icon.png, что уже в манифесте, не отдельная картинка.
         Генерируются скриптом scripts/generate-splash.mjs.
         Два набора, светлый и тёмный: iOS выбирает по prefers-color-scheme.
         Тёмные идут ПЕРВЫМИ — у светлых в media нет условия на схему, они
         подходят под обе, а Safari берёт первый подходящий тег. -->
    <link rel="apple-touch-startup-image" href="/splash/iphone-375x667-2x-dark.png" media="screen and (device-width: 375px) and (device-height: 667px) and (-webkit-device-pixel-ratio: 2) and (prefers-color-scheme: dark) and (orientation: portrait)">
    <link rel="apple-touch-startup-image" href="/splash/iphone-414x736-3x-dark.png" media="screen and (device-width: 414px) and (device-height: 736px) and (-webkit-device-pixel-ratio: 3) and (prefers-color-scheme: dark) and (orientation: portrait)">
    <link rel="apple-touch-startup-image" href="/splash/iphone-414x896-2x-dark.png" media="screen and (device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 2) and (prefers-color-scheme: dark) and (orientation: portrait)">
    <link rel="apple-touch-startup-image" href="/splash/iphone-414x896-3x-dark.png" media="screen and (device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 3) and (prefers-color-scheme: dark) and (orientation: portrait)">
    <link rel="apple-touch-startup-image" href="/splash/iphone-375x812-3x-dark.png" media="screen and (device-width: 375px) and (device-height: 812px) and (-webkit-device-pixel-ratio: 3) and (prefers-color-scheme: dark) and (orientation: portrait)">
    <link rel="apple-touch-startup-image" href="/splash/iphone-390x844-3x-dark.png" media="screen and (device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3) and (prefers-color-scheme: dark) and (orientation: portrait)">
    <link rel="apple-touch-startup-image" href="/splash/iphone-428x926-3x-dark.png" media="screen and (device-width: 428px) and (device-height: 926px) and (-webkit-device-pixel-ratio: 3) and (prefers-color-scheme: dark) and (orientation: portrait)">
    <link rel="apple-touch-startup-image" href="/splash/iphone-393x852-3x-dark.png" media="screen and (device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3) and (prefers-color-scheme: dark) and (orientation: portrait)">
    <link rel="apple-touch-startup-image" href="/splash/iphone-402x874-3x-dark.png" media="screen and (device-width: 402px) and (device-height: 874px) and (-webkit-device-pixel-ratio: 3) and (prefers-color-scheme: dark) and (orientation: portrait)">
    <link rel="apple-touch-startup-image" href="/splash/iphone-430x932-3x-dark.png" media="screen and (device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3) and (prefers-color-scheme: dark) and (orientation: portrait)">
    <link rel="apple-touch-startup-image" href="/splash/iphone-440x956-3x-dark.png" media="screen and (device-width: 440px) and (device-height: 956px) and (-webkit-device-pixel-ratio: 3) and (prefers-color-scheme: dark) and (orientation: portrait)">
    <link rel="apple-touch-startup-image" href="/splash/iphone-440x956-3x.png" media="screen and (device-width: 440px) and (device-height: 956px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)">
    <link rel="apple-touch-startup-image" href="/splash/iphone-430x932-3x.png" media="screen and (device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)">
    <link rel="apple-touch-startup-image" href="/splash/iphone-402x874-3x.png" media="screen and (device-width: 402px) and (device-height: 874px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)">
    <link rel="apple-touch-startup-image" href="/splash/iphone-393x852-3x.png" media="screen and (device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)">
    <link rel="apple-touch-startup-image" href="/splash/iphone-428x926-3x.png" media="screen and (device-width: 428px) and (device-height: 926px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)">
    <link rel="apple-touch-startup-image" href="/splash/iphone-390x844-3x.png" media="screen and (device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)">
    <link rel="apple-touch-startup-image" href="/splash/iphone-375x812-3x.png" media="screen and (device-width: 375px) and (device-height: 812px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)">
    <link rel="apple-touch-startup-image" href="/splash/iphone-414x896-3x.png" media="screen and (device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)">
    <link rel="apple-touch-startup-image" href="/splash/iphone-414x896-2x.png" media="screen and (device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)">
    <link rel="apple-touch-startup-image" href="/splash/iphone-414x736-3x.png" media="screen and (device-width: 414px) and (device-height: 736px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)">
    <link rel="apple-touch-startup-image" href="/splash/iphone-375x667-2x.png" media="screen and (device-width: 375px) and (device-height: 667px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)">

    <!-- Цвет приложения — до первой отрисовки. Настоящий выбор лежит в
         IndexedDB, но она асинхронная и к первому кадру не успевает, а фон
         у нас теперь пастельный в тон акценту — без этого каждый холодный
         старт мигал бы нейтральным экраном. localStorage синхронный, пишет
         его lib/accents при каждой смене цвета; нет записи (первый запуск,
         приватный режим) — остаётся дефолт из CSS. -->
    <script>
      try {
        var hex = localStorage.getItem('daylens:accent-hex')
        if (hex) document.documentElement.style.setProperty('--accent', hex)
      } catch (e) {}
    </script>

    <!-- Критический CSS: фон сразу в цвет приложения, без вспышки до
         монтирования Vue. Формула пастели продублирована из style.css
         осознанно — таблица стилей подгружается отдельным файлом и к
         первому кадру не готова, а фон нужен именно на нём. Меняешь там —
         поменяй и тут. Пауза до mount() теперь короткая и целиком локальная
         (main.ts не ждёт сеть), но не нулевая — заглушка всё равно нужна,
         особенно на Android/десктопе, где системного сплэша нет вообще. -->
    <style>
      :root {
        --accent: #8b5cf6;
        --app-bg: color-mix(in oklab, var(--accent) 9%, #faf9f7);
      }
      @supports (color: oklch(from red l c h)) {
        :root { --app-bg: oklch(from var(--accent) .955 min(c, .05) h); }
      }
      /* Тёмная тема нужна и здесь: без неё холодный старт с тёмной системной
         темой светил бы белым экраном до монтирования Vue — ровно то, ради
         чего этот блок и существует. Значения те же, что в style.css. */
      @media (prefers-color-scheme: dark) {
        :root { --app-bg: color-mix(in oklab, var(--accent) 14%, #14131a); }
        @supports (color: oklch(from red l c h)) {
          :root { --app-bg: oklch(from var(--accent) .17 min(c, .04) h); }
        }
      }
      html, body { background: var(--app-bg); margin: 0; }
      #app-loading {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #app-loading img {
        width: 96px;
        height: 96px;
        border-radius: 22px;
        box-shadow: 0 10px 30px -8px rgba(0, 0, 0, 0.25);
        animation: app-loading-pulse 1.4s ease-in-out infinite;
      }
      @keyframes app-loading-pulse {
        0%, 100% { opacity: 0.55; transform: scale(0.96); }
        50% { opacity: 1; transform: scale(1); }
      }
    </style>

    <title>Daylens</title>
  </head>
  <body>
    <div id="app">
      <!-- Показывается, пока грузится и монтируется Vue-приложение;
           mount('#app') заменит это содержимое. -->
      <div id="app-loading">
        <img src="/apple-touch-icon.png" alt="" aria-hidden="true" />
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
